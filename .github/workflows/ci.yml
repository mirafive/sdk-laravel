name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        exclude:
          # Laravel 11 does not support PHP 8.5.
          - php: '8.5'
            laravel: '11'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none

      # Laravel 11 is past security support; Composer would otherwise refuse to install it at all.
      - name: Allow Laravel 11
        if: matrix.laravel == '11'
        run: composer config audit.block-insecure false

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with "laravel/framework:^${{ matrix.laravel }}.0"

      - name: Check
        run: composer check
